name: Keep Supabase Awake

# El plan Free de Supabase pausa un proyecto tras una semana sin actividad de
# base de datos. Si eso pasa antes de la boda, quien abra su invitación ve la
# página rota: sin nombres y sin poder confirmar. Esta consulta mínima dos veces
# por semana reinicia ese contador con margen de sobra.
#
# Ojo: GitHub desactiva los workflows programados cuando el repositorio pasa 60
# días sin actividad, y avisa por correo antes de hacerlo. Si no se toca el
# repo de aquí a enero, hay que reactivarlo desde la pestaña Actions o lanzarlo
# a mano con "Run workflow".

on:
  schedule:
    # Domingos y miércoles a mediodía UTC: nunca más de 4 días entre consultas.
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY del repositorio."
            exit 1
          fi

          # Tiene que ser una consulta real a una tabla: llamar solo a la raíz de
          # la API responde sin tocar Postgres y no cuenta como actividad.
          codigo=$(curl --silent --show-error --max-time 30 \
            --output respuesta.txt --write-out '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/invitations?select=code&limit=1" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          if [ "${codigo}" != "200" ]; then
            echo "La base no respondió como se esperaba (HTTP ${codigo}):"
            cat respuesta.txt
            echo
            echo "Si el proyecto ya está pausado hay que reactivarlo desde el panel de Supabase."
            exit 1
          fi

          echo "HTTP 200: la base respondió, el contador de inactividad vuelve a cero."

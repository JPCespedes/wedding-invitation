name: Keep Supabase Awake

# El plan Free de Supabase pausa un proyecto tras una semana sin actividad de
# base de datos. Si eso pasa antes de la boda, quien abra su invitación ve la
# página rota: sin nombres y sin poder confirmar. Esta consulta mínima dos veces
# por semana reinicia ese contador con margen de sobra.
#
# Ojo: GitHub desactiva los workflows programados cuando el repositorio pasa 60
# días sin actividad, y avisa por correo antes de hacerlo. Si no se toca el
# repo de aquí a enero, hay que reactivarlo desde la pestaña Actions o lanzarlo
# a mano con "Run workflow".

on:
  schedule:
    # Domingos y miércoles a mediodía UTC: nunca más de 4 días entre consultas.
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY del repositorio."
            exit 1
          fi

          # Copiar un valor desde .env suele arrastrar las comillas o un salto de
          # línea, y eso basta para que la cabecera salga inválida. Se limpian en
          # vez de fallar por algo que no se ve a simple vista.
          limpiar() {
            printf '%s' "$1" \
              | tr -d '\r\n' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"
          }

          url=$(limpiar "${SUPABASE_URL}")
          key=$(limpiar "${SUPABASE_ANON_KEY}")
          url=${url%/}

          # Diagnóstico sin exponer la key: solo su largo y a qué familia pertenece.
          proyecto=$(printf '%s' "${url}" | sed -E 's#^https?://([^.]+)\..*#\1#')
          echo "SUPABASE_URL apunta al proyecto: ${proyecto}"
          echo "Largo de la API key: ${#key} caracteres"

          case "${key}" in
            eyJ*)
              # Un JWT son tres segmentos separados por puntos y unos 200 y pico
              # de caracteres. Si el copiado se corta en el primer punto quedan
              # 36, que siguen empezando con eyJ y parecen válidos de reojo.
              segmentos=$(printf '%s' "${key}" | awk -F. '{print NF}')
              if [ "${segmentos}" -ne 3 ] || [ "${#key}" -lt 100 ]; then
                echo "Formato de la key: JWT incompleto. Tiene ${segmentos} de 3 segmentos y ${#key} caracteres, cuando lo normal son más de 200."
                echo "El copiado se cortó. Volvé a copiar la anon key entera, de una sola vez."
                exit 1
              fi
              echo "Formato de la key: JWT anon completo, correcto." ;;
            sb_publishable_*)
              echo "Formato de la key: publishable, correcto." ;;
            sb_secret_*|service_role*)
              echo "Formato de la key: es una key SECRETA. Acá va la anon/publishable, la misma que usa la app en el navegador."
              exit 1 ;;
            http*)
              echo "Formato de la key: parece una URL. Seguramente se pegó el valor equivocado en el secret."
              exit 1 ;;
            *)
              echo "Formato de la key: no reconocido. Debería empezar con 'eyJ' o con 'sb_publishable_'." ;;
          esac

          # Tiene que ser una consulta real a una tabla: llamar solo a la raíz de
          # la API responde sin tocar Postgres y no cuenta como actividad.
          codigo=$(curl --silent --show-error --max-time 30 \
            --output respuesta.txt --write-out '%{http_code}' \
            "${url}/rest/v1/invitations?select=code&limit=1" \
            --header "apikey: ${key}" \
            --header "Authorization: Bearer ${key}")

          if [ "${codigo}" = "401" ] || [ "${codigo}" = "403" ]; then
            echo "Supabase rechazó la key (HTTP ${codigo}):"
            cat respuesta.txt
            echo
            echo "La base está despierta, el problema es el secret. Comprobá que:"
            echo "  - SUPABASE_ANON_KEY sea el mismo valor que VITE_SUPABASE_ANON_KEY del .env"
            echo "  - ese valor corresponda al proyecto '${proyecto}' y no a otro"
            exit 1
          fi

          if [ "${codigo}" != "200" ]; then
            echo "La base no respondió como se esperaba (HTTP ${codigo}):"
            cat respuesta.txt
            echo
            echo "Si el proyecto ya está pausado hay que reactivarlo desde el panel de Supabase."
            exit 1
          fi

          echo "HTTP 200: la base respondió, el contador de inactividad vuelve a cero."
